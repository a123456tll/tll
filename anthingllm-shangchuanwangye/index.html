<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  input[type=file] { display: block; margin: 12px 0; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-family: ui-monospace, monospace; }
  button { padding: 8px 18px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow: auto; white-space: pre-wrap; }
  .ok { color: #1a7f37; } .err { color: #cf222e; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  .hint { font-size: 13px; color: #57606a; }
</style>
</head>
<body>
<h2>AnythingLLM 文档上传并向量化</h2>
<p>
  当前服务：<span id="base"></span><br>
  目标工作区（第一个）：<span id="ws">…</span><br>
  说明：若重启 AnythingLLM 后端口变化，请在地址栏加 <code>?api=http://localhost:新端口/api</code> 打开本页。
</p>

<label for="key">API Key</label>
<input type="text" id="key" placeholder="粘贴 AnythingLLM API Key" autocomplete="off">
<p class="hint">
  密钥仅保存在本机浏览器的 localStorage 中，不会随代码提交。
  获取方式：AnythingLLM 界面 → <em>Settings</em> → <em>API Keys</em> → <em>New API Key</em>。
</p>

<label for="file">选择文档</label>
<input type="file" id="file">
<button id="upload">上传并嵌入</button>
<div id="status"></div>
<pre id="result"></pre>

<script>
const API_BASE = new URLSearchParams(location.search).get('api') || 'http://localhost:50368/api';
const KEY_STORAGE = 'anythingllm.apiKey';
let wsSlug = '';

const keyInput = document.getElementById('key');
keyInput.value = localStorage.getItem(KEY_STORAGE) || '';
keyInput.addEventListener('change', () => {
  const value = keyInput.value.trim();
  if (value) localStorage.setItem(KEY_STORAGE, value);
  else localStorage.removeItem(KEY_STORAGE);
});

function apiKey() {
  return keyInput.value.trim();
}

document.getElementById('base').textContent = API_BASE;

function loadWorkspaces() {
  const wsEl = document.getElementById('ws');
  if (!apiKey()) {
    wsEl.textContent = '请先填写 API Key';
    return;
  }
  wsEl.textContent = '读取中…';
  fetch(API_BASE + '/v1/workspaces', { headers: { Authorization: 'Bearer ' + apiKey() } })
    .then(r => r.json())
    .then(data => {
      wsSlug = data.workspaces[0].slug;
      wsEl.textContent = data.workspaces[0].name + ' (slug=' + wsSlug + ')';
    })
    .catch(e => {
      wsSlug = '';
      wsEl.innerHTML = '<span class="err">获取工作区失败：' + e.message + '</span>';
    });
}

loadWorkspaces();
keyInput.addEventListener('change', loadWorkspaces);

async function jsonReq(url, init) {
  const r = await fetch(url, init);
  const body = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + body);
  return JSON.parse(body);
}

document.getElementById('upload').onclick = async () => {
  const file = document.getElementById('file').files[0];
  const st = document.getElementById('status');
  const pre = document.getElementById('result');
  if (!apiKey()) { st.innerHTML = '<span class="err">请先填写 API Key</span>'; return; }
  if (!file) { st.innerHTML = '<span class="err">请先选择文件</span>'; return; }
  if (!wsSlug) { st.innerHTML = '<span class="err">尚未获取到工作区</span>'; return; }

  const headers = { Authorization: 'Bearer ' + apiKey() };

  try {
    const fd = new FormData();
    fd.append('file', file);

    st.innerHTML = '第 1/2 步：上传中…';
    const up = await jsonReq(API_BASE + '/v1/document/upload', {
      method: 'POST',
      headers: headers,
      body: fd
    });
    const location = up.documents[0].location;

    st.innerHTML = '第 2/2 步：向量化嵌入中…';
    const em = await jsonReq(API_BASE + '/v1/workspace/' + encodeURIComponent(wsSlug) + '/update-embeddings', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
      body: JSON.stringify({ adds: [location] })
    });

    st.innerHTML = '<span class="ok">成功：已上传并完成向量化嵌入</span>';
    pre.textContent = JSON.stringify({
      uploaded: up.documents.map(d => d.title),
      embeddedInto: wsSlug,
      workspaceMessage: em.message,
      workspaceDocuments: em.workspace.documents.map(d => d.filename)
    }, null, 2);
  } catch (e) {
    st.innerHTML = '<span class="err">失败：' + e.message + '</span>';
  }
};
</script>
</body>
</html>
